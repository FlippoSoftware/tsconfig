name: Release

on:
    push:
        branches:
            - main
    # Publishes an existing release again, e.g. when its publication failed: run it with the tag (`tsconfig-v1.1.0`).
    workflow_dispatch:
        inputs:
            tag:
                description: Tag of the release to publish
                required: true

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release-please:
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        outputs:
            # The outputs of release-please-action v4 use underscores.
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Create/update release PR, or tag a release
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: release-please
        # Runs after a release of release-please, or by hand for an existing tag. `!cancelled()` lets it run after the
        # skipped job above (by default a job needs every `needs` to succeed) but not after Cancel.
        if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            # npm trusted publishing (OIDC): no npm token is stored in the secrets.
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            # Node 24+ ships npm 11, which trusted publishing needs (pnpm publish runs npm).
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org
                  cache: pnpm

            # `pnpm publish` runs the `prepare` script (simple-git-hooks): the dependencies must be installed.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish to npm
              run: pnpm publish --no-git-checks
